<script>
/*
do while :do while loop is similar to while loop but while is executed when conditions is true and do will be executed at least once time either condition is true or false

do 
{
  statements;
  increment/decrement;
}
while(condition);

*/
var i=0;
do
{
    document.write(i + "<br>");
    i++;
}
while(i<=10);
</script>
