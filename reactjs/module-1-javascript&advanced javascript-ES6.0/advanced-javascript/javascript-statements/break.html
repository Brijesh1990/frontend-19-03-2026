<script>
/* 
 * This script is used to handle the form submission and display the results on the same page.
 * It prevents the default form submission behavior and instead processes the input data using JavaScript.
 * The results are then displayed in a designated area on the page without refreshing the entire page.
 */
 
 var i=10;
 for(i=1; i<=10; i++)
    {
        if(i==6)
        {
            break; // Exit the loop when i equals 6
        }
        document.write(i + "<br>");
    }
 
</script>
