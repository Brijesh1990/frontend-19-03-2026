<script>
 /*  
 
 forof loop is used to iterate over iterable objects like arrays, strings, maps, sets, etc. It allows you to loop through the elements of an iterable and perform actions on each element.
 
 */   

 employees = ["John", "Jane", "Jack", "Jill","sweta","ravi","shweta","priya","sneha","sachin"];
 for (const items of employees) {
    document.write(items + "<br>");
}
</script>
