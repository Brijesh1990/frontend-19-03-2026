<script>
/* 

return statement is used to exit from a function and return a value from that function. It can also be used to terminate the execution of a function and return control back to the calling function.


*/

function add(a,b)
{
    var sum = a + b;
    return sum; // Return the sum of a and b
}
document.write(add(10,20)); // Call the add function with arguments 10 and 20


</script>
