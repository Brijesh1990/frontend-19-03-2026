<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

</head>
<body>
<div class="w-50 p-5 mt-5 mx-auto bg-white">
   <form>
    <div class="form-group mt-3">
        Bill : <input type="text" id="bill" placeholder="Bill" value="50" class="form-control" />
    </div>

    
    <div class="form-group mt-3">
        People : <input type="text" id="people" placeholder="People" value="3" class="form-control" />
    </div>

    
    <div class="form-group mt-3">
        <label>Total percentage <span id="tot">27%</span></label>
    </div>
    <div class="form-group mt-3">
         <input type="range" id="range" min="0" max="100"  value="100" style="width: 100%;" />
    </div>

    
    <div class="form-group mt-3">
         <label class="bg-primary p-2 text-white">Totals tips provided : <span id="subtottip">4.5%</span> </label>
    </div>
   </form> 
</div>    
</body>
</html>
