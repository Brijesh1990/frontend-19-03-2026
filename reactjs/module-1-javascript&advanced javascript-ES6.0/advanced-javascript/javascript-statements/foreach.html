<script>
/*
foreach loop is used to iterate over the elements of an array or collection. It executes a block of code for each element in the array

*/

var employees = ["John", "Jane", "Jack", "Jill","sweta","ravi","shweta","priya","sneha","sachin"];
employees.forEach(function(items) {
    document.write(items + "<br>");
});

    
</script>
