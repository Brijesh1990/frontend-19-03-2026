<script>
/* 
continue statement is used to skip the current iteration of a loop and continue with the next iteration. It is often used in loops to skip certain conditions or values.
 */
 var i=10;
 for(i=1; i<=10; i++)
    {
        if(i==5 || i==7  || i==9)
        {
            continue; // Skip the rest of the loop body
        }
        document.write(i + "<br>");
    }
 
</script>
